<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071920">
  <title>Gelgit — Batık Kıyı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="world.js"></script>
  <script defer src="expedition.js"></script>
  <script defer src="progression.js"></script>
  <script defer src="game.js"></script>
  <script defer src="feedback.js"></script>
  <script defer src="render.js"></script>
  <script defer src="camera.js"></script>
  <script defer src="main.js"></script>
</head>
<body>
  <main class="game" id="game" aria-label="Gelgit">
    <canvas class="scene" id="sea" aria-label="Gelgit keşif alanı">Canvas destekli bir tarayıcı gerekir.</canvas>
    <div class="shade" aria-hidden="true"></div>

    <header class="top">
      <div class="brand"><i class="mark" aria-hidden="true"><b></b></i><h1>Gelgit</h1></div>
      <section class="tide glass" id="tide" aria-label="Gelgit durumu">
        <div class="tide-readout" id="phase" role="status">Yüksek Su</div>
        <div class="track" aria-hidden="true"></div>
      </section>
      <nav class="toolbar" aria-label="Oyun seçenekleri">
        <button id="collection-open" class="glass" type="button" aria-haspopup="dialog">Koleksiyon</button>
        <button id="sound" class="glass" type="button" aria-pressed="true" aria-label="Oyun sesi">Ses</button>
        <button id="pause" class="glass pause-button" type="button" aria-pressed="false" aria-label="Duraklat"><span aria-hidden="true">Ⅱ</span></button>
      </nav>
    </header>

    <div id="waypoint" class="waypoint glass" hidden><span id="waypoint-arrow" aria-hidden="true"></span><span id="waypoint-name"></span></div>
    <div id="banner" class="banner" role="status" hidden><span id="banner-caption"></span><strong id="banner-title"></strong></div>

    <section class="task" aria-label="Sefer hedefi">
      <span class="eyebrow"><i></i><span id="mode">Teknede</span></span>
      <h2 id="location">Başlangıç Limanı</h2>
      <div class="objective"><span id="objective">Çekilmeyi bekle</span></div>
      <div class="cargo" id="cargo" aria-label="Yük"></div>
    </section>

    <div class="interaction">
      <button id="action" class="action glass" type="button" hidden><kbd>E</kbd><span id="action-label"></span></button>
      <div id="opening" class="opening glass" hidden>
        <span id="opening-label">Kasa açılıyor</span>
        <progress id="opening-meter" max="1" value="0" aria-label="Kasa açma ilerlemesi"></progress>
      </div>
    </div>

    <section id="harbor" class="harbor glass" aria-labelledby="harbor-title" hidden>
      <div class="harbor-heading"><span class="eyebrow">Liman atölyesi</span><span class="harbor-icon" aria-hidden="true">◇</span></div>
      <h2 id="harbor-title">Feneri Güçlendir</h2>
      <p id="harbor-requirement">Boğulmuş Kaptanın Günlüğü</p>
      <button id="upgrade" class="upgrade" type="button" disabled>Yükselt <span aria-hidden="true">↗</span></button>
      <button id="route" class="route" type="button" hidden></button>
    </section>

    <div class="controls" aria-label="Klavye kontrolleri"><kbd>WASD</kbd><span>Hareket</span><kbd>E</kbd><span>Etkileşim</span></div>
    <div id="pause-layer" class="pause-layer" hidden><button class="glass" id="resume" type="button">Devam et</button></div>

    <dialog class="collection glass" id="collection" aria-labelledby="collection-title">
      <header><h2 id="collection-title">Koleksiyon</h2><form method="dialog"><button type="submit" aria-label="Koleksiyonu kapat">×</button></form></header>
      <div id="collection-items" class="collection-items"></div>
    </dialog>
  </main>
</body>
</html>
